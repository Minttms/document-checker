<!-- templates/upload.html -->
<!DOCTYPE html>
<html>
<head>
    <title>ส่งเอกสารตรวจสอบ</title>
</head>
<body>
    <h2>ส่งเอกสาร</h2>
    <form action="/" method="post" enctype="multipart/form-data">
        ชื่อ: <input type="text" name="name" required><br><br>
        อีเมล: <input type="email" name="email" required><br><br>
        เอกสาร: <input type="file" name="file" accept=".pdf,.docx" required><br><br>
        <button type="submit">ส่งเอกสาร</button>
    </form>
</body>
</html>
